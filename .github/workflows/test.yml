name: Rich text.py Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich pytest pytest-cov flake8 pylint

      - name: Run flake8 static analysis
        run: |
          flake8 test_text.py --max-line-length=100 --extend-ignore=F401 --count --statistics

      - name: Run unit tests with coverage
        run: |
          pytest test_text.py -v --cov=rich.text --cov-branch --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
